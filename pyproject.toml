[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osintmaps"
version = "0.3.0"
description = "Mapa OSINT de España: sitios abandonados, cámaras de vigilancia, parcelas y marcadores propios sobre datos abiertos (Catastro, OpenStreetMap, Wikidata, IGN)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
# Solo hace falta para el análisis de vegetación con Sentinel-2 (experimental)
satelite = ["rasterio>=1.3", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
osintmaps = "osintmaps.cli:main"

[tool.setuptools.packages.find]
include = ["osintmaps*"]

[tool.setuptools.package-data]
osintmaps = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
