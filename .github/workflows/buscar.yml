name: Buscar

# Ejecución manual: Actions -> Buscar -> Run workflow.
# Los resultados se descargan como artefacto "datos" al terminar.
on:
  workflow_dispatch:
    inputs:
      provincia:
        description: "Provincia, 2 cifras (46 = Valencia). Vacío si usas municipios"
        required: false
        default: ""
      municipios:
        description: "Códigos de Catastro separados por comas (opcional)"
        required: false
        default: ""
      min_puntuacion:
        description: "Nota mínima para incluir un candidato"
        required: false
        default: "30"
      fotos:
        description: "Buscar fotos en Commons para los N mejores"
        required: false
        default: "100"

permissions:
  contents: read

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Los valores escritos a mano llegan como variables de entorno y se validan
    # antes de usarlos: nunca se pegan directamente en la orden.
    env:
      PROVINCIA: ${{ inputs.provincia }}
      MUNICIPIOS: ${{ inputs.municipios }}
      MIN_PUNTUACION: ${{ inputs.min_puntuacion }}
      FOTOS: ${{ inputs.fotos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Buscar
        run: |
          set -euo pipefail
          args=(buscar -v)
          if [[ -n "$PROVINCIA" ]]; then
            [[ "$PROVINCIA" =~ ^[0-9]{2}$ ]] || { echo "Provincia no válida"; exit 1; }
            args+=(--provincia "$PROVINCIA")
          fi
          if [[ -n "$MUNICIPIOS" ]]; then
            [[ "$MUNICIPIOS" =~ ^[0-9]{5}(,[0-9]{5})*$ ]] || { echo "Municipios no válidos"; exit 1; }
            args+=(--municipios "$MUNICIPIOS")
          fi
          [[ "$MIN_PUNTUACION" =~ ^[0-9]{1,3}$ ]] || { echo "Nota mínima no válida"; exit 1; }
          [[ "$FOTOS" =~ ^[0-9]{1,4}$ ]] || { echo "Número de fotos no válido"; exit 1; }
          args+=(--min-puntuacion "$MIN_PUNTUACION" --fotos "$FOTOS")
          osintmaps "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: datos
          path: datos/
          retention-days: 14
          if-no-files-found: error
