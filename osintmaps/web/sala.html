<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VLC // Sala de control · OSINT Maps</title>
<meta name="description" content="Sala de control de València: el estado de la ciudad en tiempo real con datos públicos y de conjunto.">
<meta name="theme-color" content="#04070b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="">
<style>
  :root {
    color-scheme: dark;
    --fondo: #05080c; --panel: #09111a; --panel-2: #0d1822; --panel-3: #112130;
    --borde: #142a36; --borde-fuerte: #1e4252; --texto: #dbe7ee; --suave: #91a8b5; --tenue: #5a7482;
    --cian: #22d3ee; --magenta: #ff2d95; --ambar: #fbbf24; --lima: #4ade80; --rojo: #f43f5e; --violeta: #a78bfa; --naranja: #fb923c; --azul: #60a5fa;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
    --sans: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --radio: 9px;
    /* lo que usa la máquina del tiempo (pulso.js) */
    --tinta: #dbe7ee; --tinta-suave: #91a8b5; --papel: #09111a; --blanco: #0d1822; --linea: #1e4252;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--fondo); color: var(--texto); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--cian); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--cian); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .num { font-family: var(--cond); font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #16323e; border-radius: 4px; } ::-webkit-scrollbar-track { background: transparent; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  #sala { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }

  /* ---------- Cabecera ---------- */
  #cabecera { display: flex; align-items: center; gap: 16px; padding: 0 14px; min-height: 54px; border-bottom: 1px solid var(--borde); background: #060b11; }
  .marca { font: 700 20px/1 var(--cond); letter-spacing: .06em; white-space: nowrap; color: var(--texto); }
  .marca:hover { text-decoration: none; }
  .marca b { color: var(--cian); font-weight: 700; } .marca i { color: var(--magenta); font-style: normal; }
  #reloj { font: 500 16px/1 var(--mono); color: var(--texto); }
  #reloj small { display: block; font: 500 11.5px/1.3 var(--sans); color: var(--suave); margin-top: 3px; }
  .vivo { display: inline-flex; align-items: center; gap: 7px; font: 500 12.5px/1 var(--sans); color: var(--lima); white-space: nowrap; }
  .vivo::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; animation: latido 1.8s infinite; }
  .vivo.atrasado { color: var(--ambar); } .vivo.parado { color: var(--rojo); }
  @keyframes latido { 50% { opacity: .3; } }
  #nivel-ciudad { --c: var(--lima); display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 12px; border-radius: 999px; cursor: help;
    border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 9%, #07111a); }
  #nivel-ciudad.provisional { border-style: dashed; }
  #nivel-ciudad .etq { font-size: 12.5px; color: var(--suave); }
  #nivel-ciudad .valor { font: 700 17px/1 var(--cond); letter-spacing: .03em; color: var(--c); }
  #nivel-ciudad .barras { display: flex; gap: 2px; } #nivel-ciudad .barras span { width: 5px; height: 14px; border-radius: 1px; background: #1a2f3a; }
  #nivel-ciudad .detalle { font-size: 11.5px; color: var(--tenue); }
  .chips { display: flex; gap: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--borde-fuerte); border-radius: 999px; background: transparent;
    font: 500 12px/1 var(--sans); color: var(--suave); white-space: nowrap; }
  button.chip { cursor: pointer; } button.chip:hover { border-color: var(--cian); color: var(--texto); }
  .chip .punto { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip.ok { color: var(--lima); } .chip.aviso { color: var(--ambar); } .chip.mal { color: var(--rojo); } .chip.ia { color: var(--violeta); }
  .hueco { flex: 1; }
  .acciones { display: flex; gap: 6px; }
  .accion { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border: 1px solid var(--borde-fuerte); border-radius: 8px; background: #08131c; cursor: pointer;
    font: 600 13px/1 var(--sans); color: var(--texto); }
  .accion:hover { border-color: var(--cian); color: var(--cian); text-decoration: none; } .accion[aria-pressed=true] { border-color: var(--cian); color: var(--fondo); background: var(--cian); }
  .accion svg { flex: none; }

  /* ---------- Rejilla ---------- */
  #rejilla { display: grid; grid-template-columns: 330px minmax(0, 1fr) 390px; min-height: 0; }
  .columna { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  #col-izq { border-right: 1px solid var(--borde); overflow: auto; } #col-der { border-left: 1px solid var(--borde); }
  .bloque { display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--borde); }
  .bloque.crece { flex: 1; } .bloque.fijo { flex: none; }
  .bloque > h2 { margin: 0; padding: 13px 14px 8px; display: flex; align-items: baseline; gap: 8px; font: 600 15px/1.2 var(--sans); color: var(--texto); }
  .bloque > h2 .nota { margin-left: auto; font: 500 12px var(--sans); color: var(--tenue); white-space: nowrap; }
  .cuerpo { overflow: auto; padding: 0 14px 12px; min-height: 0; }
  #b-sucesos { max-height: 46%; }

  /* Parte */
  #parte { font-size: 14.5px; line-height: 1.6; color: var(--texto); }
  #parte details { margin-top: 10px; color: var(--suave); font-size: 13px; }
  #parte summary { cursor: pointer; color: var(--tenue); font-size: 12.5px; }
  #parte summary:hover { color: var(--cian); }
  #parte details p { margin: 6px 0 0; }

  /* Cifras de la ciudad */
  #tejas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .teja { --estado: var(--tenue); border: 1px solid var(--borde); border-radius: var(--radio); background: var(--panel-2); padding: 9px 11px 9px; min-width: 0; }
  .teja.ancha { grid-column: 1 / -1; }
  .teja .n { font-size: 12.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .teja .v { font: 600 24px/1.1 var(--cond); font-variant-numeric: tabular-nums; margin-top: 3px; } .teja .v small { font: 500 13px var(--sans); color: var(--suave); margin-left: 4px; }
  .teja .z { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--suave); margin-top: 4px; }
  .teja .z::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--estado); }
  .teja.normal { --estado: var(--lima); } .teja.alto { --estado: var(--magenta); border-color: color-mix(in srgb, var(--magenta) 40%, var(--borde)); }
  .teja.bajo { --estado: var(--azul); border-color: color-mix(in srgb, var(--azul) 40%, var(--borde)); }
  .reparto { display: flex; height: 9px; border-radius: 5px; overflow: hidden; margin: 8px 0 6px; background: #13232d; gap: 2px; }
  .reparto i { display: block; height: 100%; min-width: 3px; }
  .reparto-ley { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--suave); }
  .reparto-ley span { display: inline-flex; align-items: center; gap: 5px; } .reparto-ley b { color: var(--texto); font-weight: 600; }
  .reparto-ley i { width: 12px; height: 3px; border-radius: 2px; background: var(--c); }
  .reparto-ley i.rayas { background: repeating-linear-gradient(90deg, #e2e8f0 0 4px, transparent 4px 6px); }
  .boton-texto { margin-top: 10px; border: 0; background: none; padding: 0; color: var(--tenue); font-size: 12.5px; cursor: pointer; }
  .boton-texto:hover { color: var(--cian); }
  #tejas-todas { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  #tejas-todas .teja { padding: 7px 9px; } #tejas-todas .teja .v { font-size: 18px; }

  /* Listas */
  .fila { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 0; border-bottom: 1px solid #0f2530; cursor: pointer; }
  .fila:hover .t { color: var(--cian); }
  .fila .t { font-weight: 600; } .fila .s { grid-column: 1 / -1; font-size: 12.5px; color: var(--suave); }
  .medidor { height: 4px; border-radius: 2px; background: #13232d; margin-top: 5px; grid-column: 1 / -1; overflow: hidden; } .medidor i { display: block; height: 100%; }
  .etiqueta { display: inline-block; padding: 1px 7px; border-radius: 999px; border: 1px solid color-mix(in srgb, currentColor 55%, transparent); font: 600 11px/1.45 var(--sans); }
  .vacio { color: var(--tenue); font-size: 13px; padding: 8px 0; }
  #hoy .a { display: grid; grid-template-columns: 26px 46px 1fr; gap: 8px; align-items: center; padding: 5px 0; font-size: 13.5px; cursor: pointer; }
  #hoy .a:hover span:last-child { color: var(--cian); }
  #hoy .a .h { font: 600 13px var(--cond); color: var(--ambar); font-variant-numeric: tabular-nums; }

  /* Iconos redondos (los mismos que en el mapa) */
  .ico { --c: var(--suave); width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--c); color: #e7f1f6; background: #08121a; }
  .ico.grande { width: 34px; height: 34px; border-width: 2px; background: color-mix(in srgb, var(--c) 16%, #08121a); }

  /* Sucesos */
  .suceso { display: grid; grid-template-columns: 34px 1fr; gap: 3px 11px; padding: 11px 0; border-bottom: 1px solid #0f2530; cursor: pointer; }
  .suceso .ico { grid-row: span 3; align-self: start; }
  .suceso.activo .ico { box-shadow: 0 0 14px color-mix(in srgb, var(--c) 55%, transparent); }
  .suceso:hover .t { color: var(--cian); }
  .suceso.cerrado { opacity: .6; } .suceso.cerrado .ico { border-style: dashed; background: #08121a; }
  .suceso .t { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .suceso .s { font-size: 12.5px; color: var(--suave); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .suceso .fuerza { height: 4px; border-radius: 2px; background: #13232d; overflow: hidden; margin-top: 3px; } .suceso .fuerza i { display: block; height: 100%; background: var(--c); }
  .sin-causa { color: var(--magenta); } .con-causa { color: var(--lima); }

  /* Lo que se publica */
  .pestanas { display: flex; gap: 2px; margin-left: auto; }
  .pestanas button { border: 1px solid var(--borde); border-radius: 999px; background: transparent; padding: 4px 10px; font: 500 12px/1 var(--sans); color: var(--suave); cursor: pointer; }
  .pestanas button[aria-pressed=true] { color: var(--fondo); background: var(--cian); border-color: var(--cian); }
  .texto { display: grid; grid-template-columns: 26px 1fr; gap: 3px 11px; padding: 10px 0; border-bottom: 1px solid #0f2530; }
  .texto .ico { grid-row: span 2; align-self: start; }
  .texto .t { font-size: 13.5px; line-height: 1.38; } .texto .t a { color: var(--texto); } .texto .t a:hover { color: var(--cian); }
  .texto .s { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--suave); }
  .texto .s .ir { color: var(--cian); cursor: pointer; }
  .texto.urgente .t a { color: #fecdd3; }

  /* ---------- Mapa ---------- */
  #centro { position: relative; min-height: 0; }
  #mapa-zona { position: absolute; inset: 0; overflow: hidden; }
  #mapa { position: absolute; inset: 0; z-index: 0; background: #05090d; }
  .leaflet-container { font: inherit; background: #05090d; }
  #mapa .leaflet-tile-pane { filter: saturate(.5) brightness(.8) contrast(1.05); }
  .leaflet-bar { border: 1px solid var(--borde-fuerte) !important; border-radius: 8px !important; overflow: hidden; }
  .leaflet-bar a { background: #08131c; color: var(--texto); border-color: var(--borde-fuerte); }
  .leaflet-bar a:hover { background: #0d1d29; color: var(--cian); }
  .leaflet-control-attribution { background: rgba(5,8,12,.75) !important; color: var(--tenue) !important; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--suave) !important; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #09121a; color: var(--texto); border: 1px solid var(--borde-fuerte); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  .leaflet-popup-content { margin: 11px 13px; font-size: 13px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--suave); }
  .leaflet-tooltip.sala { background: rgba(7,13,19,.95); color: var(--texto); border: 1px solid var(--borde-fuerte); border-radius: 8px; box-shadow: none; font-size: 12.5px; padding: 6px 9px; }
  .leaflet-tooltip.sala::before { display: none; }
  .tt-n { font-weight: 600; font-size: 13px; } .tt-s { color: var(--suave); }
  .pop-lista { display: grid; gap: 8px; max-height: 260px; overflow: auto; }
  .pop-lista .s { font-size: 11.5px; color: var(--suave); }
  .nombre-barrio { background: none; border: none; box-shadow: none; color: rgba(219,231,238,.6); font: 600 11px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 0 4px #000, 0 0 2px #000; }
  .nombre-barrio::before { display: none; }

  /* Marcas del mapa: un círculo oscuro con su dibujo; el aro, del color de lo que es */
  .insignia span { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; background: #08121a; border: 1.5px solid var(--c); color: #eaf3f8;
    box-shadow: 0 0 0 2px rgba(3,6,9,.55), 0 0 10px color-mix(in srgb, var(--c) 35%, transparent); }
  .insignia.llena span { background: var(--c); color: #05080c; }
  .insignia.carretera span { border-radius: 4px; transform: rotate(45deg) scale(.86); } .insignia.carretera svg { transform: rotate(-45deg); }
  .insignia b { position: absolute; top: -6px; right: -7px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--c); color: #05080c; font: 700 10.5px/16px var(--sans); text-align: center; }
  .insignia.carretera b { top: -9px; right: -10px; }
  .marca-suceso span { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--c); color: #fff;
    background: color-mix(in srgb, var(--c) 26%, #08121a); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 60%, transparent); }
  .marca-suceso.activo span::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--c); animation: onda 2.2s ease-out infinite; }
  .marca-suceso.cerrado span { border-style: dashed; box-shadow: none; background: #08121a; opacity: .6; }
  @keyframes onda { from { transform: scale(1); opacity: .85; } to { transform: scale(2.4); opacity: 0; } }
  .leaflet-tooltip.rotulo-suceso { background: rgba(5,8,12,.9); border: 1px solid var(--magenta); color: #fff; border-radius: 6px; padding: 3px 8px; font: 600 12.5px/1.3 var(--sans); box-shadow: none;
    max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
  .leaflet-tooltip.rotulo-suceso.rojo { border-color: var(--rojo); }
  .leaflet-tooltip.rotulo-suceso::before { display: none; }
  .icono-heli { color: var(--rojo); font: 700 11px/1 var(--mono); white-space: nowrap; text-shadow: 0 0 6px #000; }
  .icono-heli b { display: inline-block; width: 12px; height: 12px; margin-right: 4px; border: 2px solid currentColor; border-radius: 50%; vertical-align: -2px; box-shadow: 0 0 8px currentColor; }
  .capa-calor { pointer-events: none; }

  /* Capas, con su leyenda dentro */
  #capas { position: absolute; top: 10px; right: 10px; z-index: 800; width: 262px; max-height: calc(100% - 40px); overflow: auto; padding: 6px;
    background: rgba(7,13,19,.93); border: 1px solid var(--borde-fuerte); border-radius: 12px; box-shadow: 0 12px 36px rgba(0,0,0,.45); }
  #capas .cab { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px 6px; font-weight: 600; font-size: 14px; }
  #capas .cab button { border: 0; background: none; color: var(--suave); cursor: pointer; font-size: 12.5px; padding: 2px 4px; }
  #capas .cab button:hover { color: var(--cian); }
  #capas.plegado .capa { display: none; }
  .capa { display: grid; grid-template-columns: 32px 1fr; gap: 1px 9px; align-items: center; width: 100%; padding: 5px 7px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; }
  .capa:hover { background: rgba(34,211,238,.06); }
  .capa .interruptor { width: 30px; height: 17px; border-radius: 9px; background: #1a2b36; position: relative; transition: background .15s; }
  .capa .interruptor::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #5d7684; transition: transform .15s, background .15s; }
  .capa[aria-checked=true] .interruptor { background: color-mix(in srgb, var(--cian) 32%, #10202a); }
  .capa[aria-checked=true] .interruptor::after { transform: translateX(13px); background: var(--cian); }
  .capa .nombre { font-weight: 600; font-size: 13.5px; }
  .capa .ley { grid-column: 2; display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; font-size: 11.5px; color: var(--suave); line-height: 1.35; }
  .capa[aria-checked=false] .ley { opacity: .45; }
  .ley span { display: inline-flex; align-items: center; gap: 5px; }
  .ley .linea { width: 16px; height: 4px; border-radius: 2px; background: var(--c); }
  .ley .linea.rayas { background: repeating-linear-gradient(90deg, #e2e8f0 0 4px, transparent 4px 7px); }
  .ley .rampa { width: 90px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(37,99,235,.35), #7c3aed 40%, #22d3ee 72%, #ecfeff); }
  .ley .mini { --c: var(--suave); width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; border: 1.5px solid var(--c); background: #08121a; color: #eaf3f8; }
  .ley .mini.carretera { border-radius: 3px; transform: rotate(45deg) scale(.85); } .ley .mini.carretera svg { transform: rotate(-45deg); }
  .ley .cuadro { width: 14px; height: 10px; border-radius: 2px; background: color-mix(in srgb, var(--magenta) 45%, transparent); border: 1px solid var(--magenta); }
  #b-capas { display: none; }
  #b-investigar { position: absolute; top: 84px; left: 10px; z-index: 800; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--borde-fuerte); background: #08131c;
    color: var(--texto); cursor: pointer; display: grid; place-items: center; }
  #b-investigar:hover { color: var(--cian); } #b-investigar[aria-pressed=true] { background: var(--magenta); border-color: var(--magenta); color: #fff; }
  #mapa-zona.investigando #mapa { cursor: crosshair; }
  #leyenda { position: absolute; left: 10px; bottom: 26px; z-index: 800; background: rgba(7,13,19,.93); border: 1px solid var(--borde-fuerte); border-radius: 10px; padding: 9px 11px; font-size: 12px; max-width: 280px; }
  #leyenda:empty { display: none; }
  #mapa-zona.con-pulso #leyenda { bottom: calc(var(--alto-pulso, 0px) + 18px); }
  #leyenda .titulo { font-weight: 600; font-size: 12.5px; margin-bottom: 6px; }
  #leyenda .lin { display: flex; align-items: center; gap: 6px; margin: 3px 0; color: var(--suave); }
  #leyenda .degradado { height: 8px; width: 190px; border-radius: 4px; margin: 4px 0 2px; }
  #tira-parte { display: none; }
  #aviso-mapa { position: absolute; inset: 0; z-index: 850; display: grid; place-items: center; background: rgba(5,8,12,.72); text-align: center; padding: 20px; }
  #aviso-mapa div { max-width: 420px; border: 1px solid var(--borde-fuerte); border-radius: 12px; background: var(--panel); padding: 18px 20px; }
  #aviso-mapa b { display: block; font: 600 16px var(--sans); color: var(--cian); margin-bottom: 6px; }
  #aviso-mapa p { margin: 0; color: var(--suave); }

  /* ---------- La ficha (suceso, barrio, lugar, comparar, movilidad) ---------- */
  #ficha { position: absolute; top: 10px; right: 10px; bottom: 10px; width: min(540px, calc(100% - 70px)); z-index: 900; display: flex; flex-direction: column;
    background: rgba(8,14,21,.98); border: 1px solid var(--borde-fuerte); border-radius: 12px; box-shadow: 0 24px 70px rgba(0,0,0,.65); overflow: hidden; }
  #ficha.estrecha { width: min(420px, calc(100% - 70px)); }
  #ficha .cab { display: flex; align-items: flex-start; gap: 10px; padding: 13px 15px 11px; border-bottom: 1px solid var(--borde); }
  #ficha .cab .tipo { font: 600 12.5px/1 var(--sans); color: var(--c, var(--cian)); }
  #ficha .cab h3 { margin: 5px 0 0; font: 600 20px/1.2 var(--cond); letter-spacing: .01em; }
  #ficha .cab .sub { margin-top: 4px; color: var(--suave); font-size: 13px; }
  #ficha .cerrar { margin-left: auto; border: 1px solid var(--borde-fuerte); border-radius: 8px; background: transparent; width: 34px; height: 34px; cursor: pointer; color: var(--suave); font-size: 18px; flex: none; }
  #ficha .cerrar:hover { color: var(--cian); border-color: var(--cian); }
  #ficha .contenido { overflow: auto; padding: 4px 15px 16px; flex: 1; }
  #ficha section { padding: 11px 0; border-bottom: 1px solid #12303b; }
  #ficha section:last-child { border-bottom: 0; }
  #ficha h4 { margin: 0 0 8px; font: 600 13.5px/1.2 var(--sans); color: var(--cian); }
  #ficha p { margin: 0 0 6px; }
  #ficha .resumen { font-size: 14.5px; line-height: 1.6; border-left: 2px solid var(--violeta); padding-left: 11px; }
  #ficha .resumen small { display: block; color: var(--violeta); font: 600 11.5px var(--sans); margin-top: 5px; }
  table.datos { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.datos th { text-align: left; font: 600 11.5px/1.2 var(--sans); color: var(--tenue); padding: 4px 6px 5px 0; border-bottom: 1px solid var(--borde); }
  table.datos td { padding: 5px 6px 5px 0; border-bottom: 1px solid #0d222b; vertical-align: top; }
  table.datos td.num { font-family: var(--mono); font-size: 12px; text-align: right; white-space: nowrap; }
  .z-pos { color: var(--magenta); } .z-neg { color: var(--azul); } .z-0 { color: var(--suave); }
  .grafica { width: 100%; height: 120px; display: block; margin: 4px 0 2px; }
  .grafica.alta { height: 170px; }
  .pie { font-size: 11.5px; color: var(--tenue); }
  .causa { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; padding: 5px 0; font-size: 13px; }
  .causa .peso { font: 600 12px var(--mono); }
  .controles { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .controles label { font: 600 11.5px/1 var(--sans); color: var(--suave); display: flex; flex-direction: column; gap: 4px; }
  select, input[type=range], input[type=search] { background: #08131c; color: var(--texto); border: 1px solid var(--borde-fuerte); border-radius: 6px; padding: 5px 6px; font: 13px var(--sans); }
  input[type=range] { padding: 0; accent-color: var(--cian); width: 100%; }
  .boton-fino { border: 1px solid var(--borde-fuerte); border-radius: 7px; background: #08131c; padding: 6px 10px; cursor: pointer; font: 600 12.5px/1 var(--sans); color: var(--texto); }
  .boton-fino:hover { border-color: var(--cian); color: var(--cian); }
  .rejilla-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .dato .n { font: 600 11.5px/1.2 var(--sans); color: var(--tenue); }
  .dato .v { font-size: 14px; margin-top: 3px; }
  .aviso-web { border: 1px dashed var(--borde-fuerte); border-radius: 8px; padding: 8px 10px; color: var(--suave); font-size: 12.5px; }

  /* Confianza, hilos, línea de tiempo, novedades, informes y modo pared */
  .conf { display: inline-block; padding: 1px 8px; border-radius: 999px; font: 600 11.5px/1.5 var(--sans); border: 1px solid currentColor; white-space: nowrap; }
  .fila .conf { align-self: start; justify-self: end; }
  .conf.alta { color: var(--lima); } .conf.media { color: var(--ambar); } .conf.baja { color: var(--tenue); border-style: dashed; }
  .suceso.falso { opacity: .45; } .suceso.falso .t { text-decoration: line-through; }
  .matriz { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .matriz .celda { border: 1px dashed var(--borde-fuerte); border-radius: 8px; padding: 7px 9px; color: var(--tenue); font-size: 12.5px; min-width: 0; }
  .matriz .celda b { display: block; font-weight: 600; font-size: 12.5px; margin-bottom: 2px; }
  .matriz .celda.si { border-style: solid; border-color: var(--lima); color: var(--texto); background: color-mix(in srgb, var(--lima) 7%, transparent); } .matriz .celda.si b { color: var(--lima); }
  .boton-fino[aria-pressed=true] { border-color: var(--cian); color: var(--cian); }
  .hilo { grid-column: 2; font-size: 12.5px; display: grid; gap: 5px; padding: 4px 0 2px 10px; border-left: 2px solid var(--borde-fuerte); } .hilo a { color: var(--texto); }
  .aforo { color: var(--ambar); font-size: 12px; white-space: nowrap; }
  .ley .rampa.naranja { background: linear-gradient(90deg, rgba(180,83,9,.35), #fb923c 60%, #fff7ed); }
  #linea { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 780; height: 62px; padding: 5px 9px 4px; border-radius: 10px; background: rgba(7,13,19,.93); border: 1px solid var(--borde-fuerte); }
  #linea .cab { display: flex; align-items: center; gap: 8px; height: 16px; font-size: 11.5px; color: var(--suave); }
  #linea .cab button { margin: 0 0 0 auto; border: 1px solid var(--cian); border-radius: 999px; background: none; color: var(--cian); font: 600 11px/1 var(--sans); padding: 2px 9px; cursor: pointer; }
  #linea-lienzo { display: block; width: 100%; height: 36px; cursor: ew-resize; touch-action: none; }
  #mapa-zona:has(#linea:not([hidden])) #leyenda { bottom: 98px; }
  #mapa-zona:has(#linea:not([hidden])) .leaflet-bottom { bottom: 74px; }
  #novedades { position: absolute; top: 10px; left: 56px; z-index: 805; max-width: min(520px, calc(100% - 350px)); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 12px;
    border-radius: 10px; background: rgba(7,13,19,.95); border: 1px solid var(--cian); font-size: 13px; }
  #salir-pared { display: none; }
  body.pared #col-izq, body.pared #col-der, body.pared .acciones, body.pared .chips, body.pared #capas, body.pared #b-investigar, body.pared #b-capas, body.pared #pestanas, body.pared #novedades { display: none !important; }
  body.pared #rejilla { grid-template-columns: 1fr; } body.pared #rejilla #centro { display: block !important; }
  body.pared #cabecera { min-height: 64px; } body.pared .marca { font-size: 26px; } body.pared #reloj { font-size: 22px; } body.pared #nivel-ciudad .valor { font-size: 24px; }
  body.pared #tira-parte { display: block; position: absolute; top: 12px; left: 60px; right: 12px; z-index: 790; padding: 12px 16px; border-radius: 12px; background: rgba(7,13,19,.92);
    border: 1px solid var(--borde-fuerte); font-size: 19px; line-height: 1.45; max-width: 900px; }
  body.pared #salir-pared { display: block; position: absolute; top: 12px; right: 12px; z-index: 900; opacity: .35; } body.pared #salir-pared:hover { opacity: 1; }
  @media print {
    body.imprimiendo #cabecera, body.imprimiendo #col-izq, body.imprimiendo #col-der, body.imprimiendo #pestanas, body.imprimiendo #mapa, body.imprimiendo #capas, body.imprimiendo #linea,
    body.imprimiendo #leyenda, body.imprimiendo #novedades, body.imprimiendo #b-capas, body.imprimiendo #b-investigar, body.imprimiendo #tira-parte, body.imprimiendo .no-imprimir, body.imprimiendo .cerrar { display: none !important; }
    body.imprimiendo, body.imprimiendo #sala, body.imprimiendo #rejilla, body.imprimiendo #centro, body.imprimiendo #mapa-zona { display: block !important; height: auto !important; position: static !important; overflow: visible !important; background: #fff !important; }
    body.imprimiendo #ficha { position: static !important; width: auto !important; border: 0; box-shadow: none; background: #fff; color: #111; overflow: visible; display: block; }
    body.imprimiendo #ficha .contenido { overflow: visible; } body.imprimiendo #ficha * { color: #111 !important; border-color: #bbb !important; }
    body.imprimiendo #ficha h4 { color: #000 !important; } body.imprimiendo .grafica { display: none; }
  }

  /* La máquina del tiempo (pulso.js) usa su propio botón: aquí se abre desde la cabecera. */
  #boton-pulso { display: none !important; }

  /* ---------- Pantallas medianas y móvil ---------- */
  #pestanas { display: none; }
  @media (max-width: 1280px) { #rejilla { grid-template-columns: 300px minmax(0, 1fr) 340px; } .acciones .rot { display: none; } #nivel-ciudad .detalle { display: none; } }
  @media (max-width: 1000px) {
    #rejilla { grid-template-columns: minmax(0, 1fr) 330px; } #col-izq { display: none; }
    #cabecera .chips .opcional { display: none; }
  }
  @media (max-width: 760px) {
    #sala { grid-template-rows: auto 1fr auto; }
    #cabecera { gap: 10px; padding: 8px 10px; flex-wrap: wrap; min-height: 0; }
    .marca { font-size: 17px; } #reloj small, #cabecera .chips, .acciones .rot, #nivel-ciudad .etq, #nivel-ciudad .detalle { display: none; }
    #reloj { font-size: 13px; order: 2; } .vivo { font-size: 0; gap: 0; order: 3; }
    #nivel-ciudad { margin-left: auto; order: 4; padding: 5px 11px; } #nivel-ciudad .valor { font-size: 15px; }
    .acciones { order: 5; width: 100%; overflow-x: auto; } .accion { height: 32px; padding: 0 11px; flex: none; }
    #rejilla { grid-template-columns: 1fr; }
    #rejilla > * { display: none !important; }
    #rejilla[data-vista=mapa] #centro { display: block !important; }
    #rejilla[data-vista=ciudad] #col-izq, #rejilla[data-vista=sucesos] #col-der, #rejilla[data-vista=feed] #col-der { display: flex !important; }
    #rejilla[data-vista=sucesos] #b-feed, #rejilla[data-vista=feed] #b-sucesos { display: none; }
    #rejilla[data-vista=sucesos] #b-sucesos { max-height: none; flex: 1; }
    #col-izq { overflow: auto; } #col-izq .bloque { flex: none; }
    #pestanas { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--borde); background: #060b11; padding-bottom: env(safe-area-inset-bottom); }
    #pestanas button { border: 0; background: transparent; padding: 12px 0 11px; font: 600 13px/1 var(--sans); color: var(--suave); position: relative; }
    #pestanas button[aria-pressed=true] { color: var(--cian); } #pestanas button[aria-pressed=true]::before { content: ""; position: absolute; left: 28%; right: 28%; top: 0; height: 2px; border-radius: 1px; background: var(--cian); box-shadow: 0 0 8px var(--cian); }
    #pestanas .cuenta { color: var(--magenta); }
    #ficha, #ficha.estrecha { position: fixed; inset: 0 0 calc(46px + env(safe-area-inset-bottom)) 0; width: auto; top: 0; right: 0; bottom: calc(46px + env(safe-area-inset-bottom));
      border: 0; border-radius: 0; z-index: 1200; background: #080e15; }
    .leaflet-control-attribution { font-size: 9px; max-width: 100vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .leaflet-control-zoom { display: none; }
    #leyenda { left: 10px; right: 132px; bottom: 26px; max-width: none; } #leyenda .degradado { width: 100%; }
    #linea { left: 8px; right: 8px; bottom: 6px; height: 54px; } #linea-lienzo { height: 28px; }
    #mapa-zona:has(#linea:not([hidden])) .leaflet-bottom { bottom: 62px; }
    #mapa-zona:has(#linea:not([hidden])) #b-capas { bottom: 86px; } #mapa-zona:has(#linea:not([hidden])) #b-investigar { bottom: 142px; }
    #mapa-zona:has(#linea:not([hidden])) #leyenda { bottom: 86px; }
    #novedades { top: 64px; left: 8px; right: 8px; max-width: none; }
    #b-investigar { top: auto; bottom: 82px; left: auto; right: 12px; width: 46px; height: 46px; border-radius: 50%; }
    #b-capas { display: inline-flex; align-items: center; gap: 7px; position: absolute; right: 12px; bottom: 26px; z-index: 810; height: 46px; padding: 0 16px; border-radius: 23px;
      border: 1px solid var(--borde-fuerte); background: rgba(8,19,28,.95); color: var(--texto); font: 600 14px/1 var(--sans); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    #capas { display: none; left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 72%; border-radius: 16px 16px 0 0; padding: 8px 8px 14px; z-index: 1000; }
    #mapa-zona.capas-abiertas #capas { display: block; }
    #capas .capa { padding: 9px 8px; }
    #tira-parte { display: block; position: absolute; top: 8px; left: 8px; right: 8px; z-index: 790; padding: 9px 12px; border-radius: 11px; cursor: pointer;
      background: rgba(7,13,19,.92); border: 1px solid var(--borde-fuerte); font-size: 13.5px; line-height: 1.45; }
    #tira-parte .texto-tira { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #tira-parte.abierta { max-height: 55%; overflow: auto; } #tira-parte.abierta .texto-tira { display: block; }
    #tira-parte:empty { display: none; }
  }
</style>
</head>
<body>
<div id="sala">
  <header id="cabecera">
    <a class="marca" href="./" title="Volver al mapa">VLC<i>//</i><b>SALA</b></a>
    <div id="reloj" class="mono">--:--:--<small id="fecha">—</small></div>
    <span id="vivo" class="vivo">en directo</span>
    <div id="nivel-ciudad" title="Lo fuera de lo normal que está la ciudad ahora mismo"><span class="etq">Ciudad</span><span class="barras" id="nivel-barras"></span><span class="valor" id="nivel-valor">—</span><span class="detalle" id="nivel-detalle"></span></div>
    <div class="chips">
      <button type="button" class="chip" id="chip-fuentes" title="De dónde salen los datos y cuántas fuentes contestan">Fuentes</button>
      <span class="chip ia opcional" id="chip-ia" hidden title="IA local: resume sucesos y escribe el parte">IA</span>
    </div>
    <span class="hueco"></span>
    <nav class="acciones" aria-label="Herramientas">
      <button type="button" class="accion" id="b-comparar" title="Comparar dos días: laborable, sábado, festivo o una fecha"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg><span class="rot">Comparar días</span></button>
      <button type="button" class="accion" id="b-movilidad" title="Movilidad: bicis que llegan y salen de cada barrio, y viajes entre distritos"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h5l3 8M10 9 8 5h3"/></svg><span class="rot">Movilidad</span></button>
      <button type="button" class="accion" id="b-informes" title="Informes: relevo de turno, calidad de la semana, riesgo de accidente, alertas y modo pared"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M10 12h6M10 16h6M10 8h3"/></svg><span class="rot">Informes</span></button>
      <button type="button" class="accion" id="b-tiempo" title="Máquina del tiempo: la ciudad en cualquier momento del histórico" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="rot">Histórico</span></button>
      <a class="accion" href="./" title="El mapa completo: capas, fotos aéreas, historia de un sitio"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span class="rot">Mapa</span></a>
    </nav>
  </header>

  <main id="rejilla" data-vista="mapa">
    <section id="col-izq" class="columna" aria-label="Estado de la ciudad">
      <div class="bloque fijo" id="b-parte"><h2>Parte <span class="nota" id="parte-nota"></span></h2><div class="cuerpo" id="parte"></div></div>
      <div class="bloque fijo" id="b-estado"><h2>Ahora <span class="nota" id="estado-nota"></span></h2>
        <div class="cuerpo"><div id="tejas"></div><button type="button" class="boton-texto" id="mas-cifras" aria-expanded="false">Ver todas las cifras</button><div id="tejas-todas" hidden></div></div></div>
      <div class="bloque fijo" id="b-hoy"><h2>Hoy <span class="nota" id="hoy-nota"></span></h2><div class="cuerpo" id="hoy"></div></div>
      <div class="bloque fijo" id="b-barrios"><h2>Barrios fuera de lo normal <span class="nota" id="barrios-nota"></span></h2><div class="cuerpo" id="lista-barrios"></div></div>
    </section>

    <section id="centro" aria-label="Mapa">
      <div id="mapa-zona">
        <div id="mapa"></div>
        <div id="tira-parte" role="button" tabindex="0" title="Ver el parte entero"></div>
        <div id="capas" role="group" aria-label="Capas del mapa"></div>
        <button type="button" id="b-capas" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/></svg>Capas</button>
        <button type="button" id="b-investigar" aria-pressed="false" title="Investigar un sitio: pulsa en el mapa para ver la ficha de ese inmueble (también con clic derecho)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></button>
        <div id="leyenda"></div>
        <div id="novedades" hidden role="status"></div>
        <div id="linea" hidden><div class="cab"><span id="linea-rotulo">Últimas 24 h</span><button type="button" id="linea-ahora" hidden>Volver a ahora</button></div>
          <canvas id="linea-lienzo" tabindex="0" role="slider" aria-label="Línea de tiempo de las últimas 24 horas: arrastra para ver cómo estaba la ciudad" title="Arrastra para ver cómo estaba la ciudad en ese momento (flechas del teclado; Esc vuelve a ahora)"></canvas></div>
        <button type="button" id="salir-pared" class="boton-fino">Salir del modo pared</button>
        <div id="aviso-mapa" hidden><div><b id="aviso-titulo">Preparando la sala</b><p id="aviso-texto"></p></div></div>
        <aside id="ficha" hidden aria-live="polite"></aside>
      </div>
    </section>

    <section id="col-der" class="columna" aria-label="Sucesos y lo que se publica">
      <div class="bloque" id="b-sucesos"><h2>Sucesos <span class="nota" id="sucesos-nota"></span></h2><div class="cuerpo" id="sucesos"></div></div>
      <div class="bloque crece" id="b-feed"><h2>Se dice <span class="pestanas" id="pestanas-feed"></span></h2><div class="cuerpo" id="feed"></div></div>
    </section>
  </main>

  <nav id="pestanas" aria-label="Vistas">
    <button type="button" data-vista="mapa" aria-pressed="true">Mapa</button>
    <button type="button" data-vista="sucesos" aria-pressed="false">Sucesos <span class="cuenta" id="pestana-n"></span></button>
    <button type="button" data-vista="ciudad" aria-pressed="false">Ciudad</button>
    <button type="button" data-vista="feed" aria-pressed="false">Se dice</button>
  </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin=""></script>
<script src="sala.js"></script>
<script src="pulso.js"></script>
</body>
</html>
